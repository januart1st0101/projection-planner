<g clip-path="url(#top-clip)"><polygon points="175,435 643.0,240.0 643.0,630.0" fill="#e0eef5" stroke="#8babbe" stroke-width="2"/><line x1="643.000" y1="240.000" x2="643.000" y2="630.000" stroke="#42657d" stroke-width="2"/><circle cx="175" cy="435" r="7" fill="#236b8e"/><rect x="132" y="420" width="35" height="30" rx="4" fill="#236b8e"/><text x="125" y="495" font-size="16" text-anchor="start" fill="#243444">鏡頭參考點</text><text x="643.0" y="216.0" font-size="18" text-anchor="middle" fill="#243444">幕面</text><line x1="175.000" y1="700.000" x2="643.000" y2="700.000" stroke="#42657d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="409.0" y="685" font-size="18" text-anchor="middle" fill="#243444">D = 7.2 m</text><line x1="677.000" y1="240.000" x2="677.000" y2="630.000" stroke="#42657d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="691.0" y="435" font-size="16" text-anchor="start" fill="#243444">W 6 m</text><text x="65" y="762" font-size="16" text-anchor="start" fill="#243444">圖面比例尺：65 SVG px / m（俯視等比）</text></g><g clip-path="url(#front-clip)"><rect x="1126.6666666666667" y="210.0" width="266.66666666666663" height="150.0" fill="#243444" stroke="#236b8e" stroke-width="2"/><rect x="1126.6666666666667" y="210.0" width="266.66666666666663" height="150.0" fill="#71b2c9"/><line x1="1106.667" y1="210.000" x2="1106.667" y2="360.000" stroke="#42657d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="1106.667" y1="210.000" x2="1106.667" y2="360.000" stroke="#42657d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><line x1="1126.667" y1="385.000" x2="1393.333" y2="385.000" stroke="#42657d" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1260" y="410" font-size="16" text-anchor="middle" fill="#243444">W 6 m | 比例 16:9</text><text x="1010" y="195" font-size="16" text-anchor="start" fill="#243444">H 3.375 m</text><text x="1010" y="432" font-size="14" text-anchor="start" fill="#243444">比例尺 44.4444 px / m（正視等比）</text></g><g clip-path="url(#spec-clip)"><text x="1010" y="507" font-size="15" text-anchor="start" fill="#243444">解析度</text><text x="1185" y="507" font-size="15" text-anchor="start" fill="#243444">1920 × 1080</text><text x="1010" y="534" font-size="15" text-anchor="start" fill="#243444">投射比</text><text x="1185" y="534" font-size="15" text-anchor="start" fill="#243444">1.2</text><text x="1010" y="561" font-size="15" text-anchor="start" fill="#243444">投射距離</text><text x="1185" y="561" font-size="15" text-anchor="start" fill="#243444">7.2 m</text><text x="1010" y="588" font-size="15" text-anchor="start" fill="#243444">畫面寬 × 高</text><text x="1185" y="588" font-size="15" text-anchor="start" fill="#243444">6 × 3.375 m</text><text x="1010" y="615" font-size="15" text-anchor="start" fill="#243444">對角線</text><text x="1185" y="615" font-size="15" text-anchor="start" fill="#243444">6.8841 m / 271.027 in</text><text x="1010" y="642" font-size="15" text-anchor="start" fill="#243444">像素間距</text><text x="1185" y="642" font-size="15" text-anchor="start" fill="#243444">3.125 mm（方形像素）</text><text x="1010" y="669" font-size="15" text-anchor="start" fill="#243444">鏡頭允許距離</text><text x="1185" y="669" font-size="15" text-anchor="start" fill="#243444">未提供鏡頭範圍</text><text x="1010" y="696" font-size="15" text-anchor="start" fill="#243444">指定位置檢查</text><text x="1185" y="696" font-size="15" text-anchor="start" fill="#243444">未檢查</text><text x="1010" y="723" font-size="15" text-anchor="start" fill="#243444">影片有效範圍</text><text x="1185" y="723" font-size="15" text-anchor="start" fill="#243444">6 × 3.375 m</text><text x="1010" y="750" font-size="15" text-anchor="start" fill="#243444">顯示方式</text><text x="1185" y="750" font-size="15" text-anchor="start" fill="#243444">contain；黑邊／裁切詳見摘要</text></g><g clip-path="url(#foot-clip)"><text x="65" y="875" font-size="16" text-anchor="start" fill="#243444">單台一般正投，平面幕面且鏡頭正對中心；不含鏡頭位移。</text><text x="65" y="894" font-size="16" text-anchor="start" fill="#243444">距離由原廠定義的鏡頭參考點量至幕面，不是機身外殼或吊架。</text><text x="65" y="913" font-size="16" text-anchor="start" fill="#243444">須核對原廠投射距離定義、鏡頭限制與安裝公差；不捏造機種規格。</text><text x="65" y="932" font-size="16" text-anchor="start" fill="#243444">不涵蓋超短焦、反射式光路、傾斜／曲面、多機融合及實機控制。</text><text x="65" y="951" font-size="16" text-anchor="start" fill="#243444">不計亮度、對焦景深、梯形校正或寫實渲染；本圖僅概念配置。</text></g>
<text x="1540" y="995" text-anchor="end" font-size="11">PP-1.0 · 概念配置 · 非施工圖</text>
</g></svg>